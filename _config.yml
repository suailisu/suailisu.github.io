title: "素爱力酥"
url: "https://suailisu.github.io"
baseurl: ""

# 集合配置
collections:
  screen:            
    output: true     
    permalink: /screen/:title/
  books:
    output: true
    permalink: /books/:title/
  games:
    output: true
    permalink: /games/:title/
  moments:
    output: true
    permalink: /moments/:title/

# 目录包含
include: [_pages]

# 默认设置
defaults:
  - scope:
      path: ""
      type: "screen"
    values:
      layout: "screen-review"

giscus:
  repo: suailisu/suailisu.github.io
  repo_id: R_kgDOQzPkfA
  category: General
  category_id: DIC_kwDOQzPkfM4C0jAt 
  mapping: specific
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  emit_metadata: 0
  lang: zh-CN
