- `vain`: having or showing an excessively high opinion of one's appearance, abilities, or worth
- `meek`: quiet, gentle, and easily imposed on; submissive
- `upstage`:divert attention from (someone) towards oneself
- `degrading`: causing someone to feel degraded or to lose self-respect; humiliating or disrespectful

- `oppressive`: unjustly inflicting hardship and constraint, especially on a minority or other subordinate group
- `premise`: a previous statement or proposition from which another is inferred or follows as a conclusion

---
## What is social psychology?
- `construe`: interpret (a word or action) in a particular way
- `hostile`: unfriendly; antagonistic
- `resentfully`: feeling or expressing bitterness or indignation at having been treated unfairly
- `elicit`: evoke or draw out (a response, answer, or fact) from someone in reaction to one's own actions or questions
- `unconscionable`: not right or reasonable
- `slaughter`: kill (people or animals) in a cruel or violent way, typically in large numbers

---
## Social psychology’s big ideas
- `grudge match`: a contest or other competitive situation based on personal antipathy between the participants
- `fistfight`: a fight with bare fists
- `erupt`: break out or burst forth suddenly and dramatically
- `infraction`: a violation or infringement of a law or agreement
- `distinctive`: characteristic of one person or thing, and so serving to distinguish it from others
- `snide`: derogatory or mocking in an indirect way

> There is an objective reality out there, but we always view it through the
lens of our beliefs and values.

- `perilous`: full of danger or risk
- `heuristics`: involving or enabling discovery or problem-solving through methods such as experimentation, evaluation, and trial and error
- `spontaneous`: occurring without apparent external cause
- `snug`:(especially of clothing) very tight or close-fitting

> In most situations, “fast and frugal” snap
judgments serve us well enough. But in others, where accuracy matters—as when
needing to fear the right things and spend our resources accordingly—we had best
restrain our impulsive intuitions with critical thinking.  -->
