      <p>这是一部与历史事实紧密联系的电影。影片背景设定在20世纪80年代的韩国，当时正处于军事独裁统治下。电影以一群被诬告政治罪的少年为线索，展现了当时司法系统中的腐败和不公。在批判历史上的不公正同时，也给人们带来了对人权和法治的思考。这样的题材，仅是允许被创作和上映就值得五星。更不用说扣人心弦的情节、振聋发聩的台词以及演员精湛的演技。在了解了故事原型以及社会影响之后，我对这部电影充满敬意。</p>
