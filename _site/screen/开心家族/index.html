          <p>在影片结尾部分揭晓真相前，我觉得影片剧情拖沓、令人一头雾水，是三星的平庸之作；揭晓时眼泪不自觉往下掉，心中五味杂陈。一瞬间对男主产生了深深的共情，觉得他实在是太可怜太可怜了。再次证明了“喜剧的内核是悲剧”。不过即便深受感动，依然觉得瑜不掩瑕，前半部分的故事还是可以讲得更好些的。设定和走向跟《你好，李焕英》还挺像的，不过李焕英的前半段叙事比这部影片有意思多了。此外，美女护士猝不及防爱上男主的桥段也让我接受不能，有些男性意淫。</p>
