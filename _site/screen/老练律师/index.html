          <p>从去年年底看到今年年中的一部剧…还记得去年年底刚开始看的时候，可以说是非常豹笑了，而且每一集都有一些小反转，令人迫不及待地想看下一集，结果一整个冬天歇过去了…再捡起来的时候就进入了追剧状态，每周刷新看有没有更新，最后在没有料想到的情况下不自知地看完了（本季）最后一集。不知道是不是换编剧了，总感觉有些不如去年拍的精彩。亚裔女同性恋律师是很搞笑的，Matty 和 Olympia 是很好嗑的，三代女律师拥有各自的成长线是很令人欣慰的。</p>
