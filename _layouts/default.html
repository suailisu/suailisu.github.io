<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    {% if page.extra_css %}
      {% for css_name in page.extra_css %}
        <link rel="stylesheet" href="{{ '/assets/css/' | append: css_name | append: '.css' | relative_url }}">
      {% endfor %}
    {% endif %}

    {% if page.extra_js %}
        {% for js in page.extra_js %}
            <script src="{{ '/assets/js/' | append: js | append: '.js' | relative_url }}"></script>
        {% endfor %}
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.6/dist/medium-zoom.min.js"></script>
</head>
<body>
    <nav class="container mt-3">
        <a href="/" class="me-3">首页</a>
        <a href="/blog/" class="me-3">文心雕龙</a>
        <a href="/screen/" class="me-3">苏幕遮</a>
        <a href="/moments/">相见欢</a>  
    </nav>
    
    <hr>
    
    <main class="container">
        {{ content }}
    </main>

    <footer class="container" style="margin-top: 50px; color: #999; font-size: 0.8em; padding-bottom: 30px;">
        &copy; {{ "now" | date: "%Y" }} {{ site.title }}
    </footer>
</body>
</html>
