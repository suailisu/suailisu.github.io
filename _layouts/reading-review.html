---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}">

<article class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="book-detail-header d-flex flex-column flex-md-row align-items-start mb-5 pb-5 border-bottom">
        
        <div class="book-detail-cover me-md-5 mb-4 mb-md-0">
          <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}" class="img-fluid shadow-lg rounded">
        </div>

        <div class="book-detail-info">
          <h1 class="display-5 fw-bold mb-3" style="color: var(--global-theme-color);">{{ page.title }}</h1>
          
          <div class="d-flex align-items-center mb-4">
            <span class="fs-5 text-secondary me-3">{{ page.authors | join: " / " }}</span>
            <span class="badge bg-light text-dark">{{ page.date | date: "%Y-%m-%d" }}</span>
          </div>

          <div class="book-tags-list">
            {% for tag in page.tags %}
              <span class="me-2" style="color: var(--global-hover-color); font-weight: 600;">#{{ tag }}</span>
            {% endfor %}
          </div>
        </div>
      </div>

      <div class="post-content-body" style="font-size: 1.1rem; line-height: 1.8;">
        {{ content }}
      </div>

      <div class="mt-5 pt-4">
        <a href="/reading/" class="text-decoration-none" style="color: var(--global-dim-color);">
          ← 返回字字锦
        </a>
      </div>
    </div>
  </div>
</article>

<style>
  /* 针对详情页的额外微调 */
  .book-detail-cover {
    width: 200px;
    flex-shrink: 0;
  }
  .book-detail-cover img {
    border: 1px solid #eee;
    transition: transform 0.5s ease;
  }
  .book-detail-cover img:hover {
    transform: rotate(-2deg) scale(1.02);
  }
  .post-content-body h2 {
    margin-top: 2rem;
    font-weight: 700;
    color: #333;
    border-left: 4px solid var(--global-theme-color);
    padding-left: 15px;
  }
  .post-content-body blockquote {
    padding: 10px 20px;
    margin: 20px 0;
    background-color: #f9f9f9;
    border-left: 4px solid var(--global-hover-color);
    font-style: italic;
  }
</style>
